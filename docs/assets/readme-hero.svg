<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">bilibili-cli — your video, your terminal</title>
  <desc id="desc">A native Rust creator workflow: inspect, upload, preview, explicitly publish, and read back. A terminal inset shows selected fields from an actual public video response.</desc>
  <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#17232B" stroke-opacity=".035"/></pattern></defs>
  <rect width="1280" height="560" rx="24" fill="#F3F5F2"/>
  <rect width="1280" height="560" rx="24" fill="url(#grid)"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#17232B">
    <text x="64" y="57" font-size="16" letter-spacing="2.7" font-weight="700">OPENMEDIA LAB / CREATOR TOOLS</text>
    <text x="64" y="161" font-size="79" letter-spacing="-4" font-weight="700">bilibili-cli</text>
    <text x="66" y="214" font-size="29">Your video. Your terminal.</text>
    <text x="66" y="258" font-size="19" fill="#65727A">Native Rust · JSON output · Receipt-backed workflow</text>
    <rect x="65" y="302" width="252" height="38" rx="19" fill="#E2E9FC"/>
    <text x="84" y="327" font-size="14" letter-spacing="1" font-weight="700" fill="#2E58DB">PREVIEW BEFORE PUBLISH</text>
    <g transform="translate(710 91)">
      <rect width="506" height="264" rx="16" fill="#17232B"/>
      <path d="M0 47H506" stroke="#34434C"/>
      <circle cx="22" cy="24" r="5" fill="#839299"/><circle cx="40" cy="24" r="5" fill="#596971"/><circle cx="58" cy="24" r="5" fill="#34434C"/>
      <g font-family="Menlo,Consolas,monospace" font-size="17">
        <text x="24" y="82" fill="#ABC1FF">$ bilibili video show 170001</text>
        <text x="24" y="123" fill="#F3F5F2">{</text>
        <text x="42" y="154" fill="#F3F5F2">"aid": 170001,</text>
        <text x="42" y="185" fill="#F3F5F2">"bvid": "BV17x411w7KC",</text>
        <text x="42" y="216" fill="#F3F5F2">"duration": 2412</text>
        <text x="24" y="247" fill="#F3F5F2">}</text>
      </g>
      <text x="316" y="27" fill="#A8B5BC" font-size="11" letter-spacing="1">SELECTED FIELDS</text>
    </g>
    <g transform="translate(64 407)">
      <g fill="#FFFFFF" stroke="#D4DBDD"><rect width="196" height="93" rx="12"/><rect x="228" width="196" height="93" rx="12"/><rect x="456" width="196" height="93" rx="12"/><rect x="684" width="196" height="93" rx="12"/><rect x="912" width="240" height="93" rx="12"/></g>
      <g fill="#2E58DB" font-size="13" letter-spacing="1.4" font-weight="700"><text x="18" y="27">01 / LOCAL</text><text x="246" y="27">02 / ASSETS</text><text x="474" y="27">03 / PAYLOAD</text><text x="702" y="27">04 / EXPLICIT</text><text x="930" y="27">05 / VERIFY</text></g>
      <g font-size="24" font-weight="700"><text x="18" y="64">Inspect</text><text x="246" y="64">Upload</text><text x="474" y="64">Preview</text><text x="702" y="64">Publish</text><text x="930" y="64">Read back</text></g>
      <g fill="none" stroke="#2E58DB" stroke-width="2"><path d="M202 47h18m-5-5 5 5-5 5"/><path d="M430 47h18m-5-5 5 5-5 5"/><path d="M658 47h18m-5-5 5 5-5 5"/><path d="M886 47h18m-5-5 5 5-5 5"/></g>
    </g>
  </g>
</svg>
