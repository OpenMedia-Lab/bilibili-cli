[package]
name = "bilibili-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A native Rust CLI for Bilibili, with preview-first video publishing"
repository = "https://github.com/OpenMedia-Lab/bilibili-cli"

[[bin]]
name = "bilibili"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "6"
hex = "0.4"
imagesize = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"

[profile.release]
lto = true
codegen-units = 1
strip = true
